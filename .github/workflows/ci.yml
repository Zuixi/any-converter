name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The desktop crate links GTK 3 and WebKitGTK 4.1 through Tauri (cgo-
      # style system deps); clippy --all-targets needs their headers. Timeout:
      # a stuck apt mirror can hold the queue for hours.
      - name: Install GTK and WebKitGTK headers
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace
      # The desktop webview must never dial the embedded server directly
      # (CORS makes every such call a TypeError at runtime).
      - name: desktop webview loopback-fetch guard
        run: ./scripts/guard-no-loopback-fetch.sh
      # Keep the release pipeline green on ordinary pushes: the CLI release
      # binary must always build, not just on tag day.
      - name: release CLI builds
        run: cargo build --release -p any-converter
      - name: contract fixtures hold no raw secrets
        run: "! grep -rEn 'sk-(ant|proj|svc)-[A-Za-z0-9_-]{16,}' tests/contracts/"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # version comes from packageManager in package.json
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: build desktop SPA
        run: pnpm --filter @any-converter/desktop build
