[package]
name = "any-converter-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP proxy server for LLM API format conversion"

[dependencies]
agent-wiring = { path = "../agent-wiring" }
any-converter-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures-util = "0.3"
tokio-stream = "0.1"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sha2 = "0.10"
toml_edit = "0.20"
atomicwrites = "0.4"
fs4 = { workspace = true }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
subtle = "2"
# rust-embed 8.12+ requires sha2 0.11 (Rust 1.88+); pin the 8.11 line so
# the workspace MSRV (1.85) keeps building without the UI dist present.
rust-embed = "=8.11.0"
rust-embed-impl = "=8.11.0"
rust-embed-utils = "=8.11.0"

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = "1"
tower = "0.5"
tempfile = "3"

[lints]
workspace = true
