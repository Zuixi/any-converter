# any-converter example configuration
#
# Canonical shape: secret values live in the OS keychain, not in this file.
# Create the first home through Desktop or a one-time inline/legacy-config
# import; afterwards start the canonical gateway with `any-converter serve`.

[management]
api_key = "keychain:any-converter:server:management"

[server]
host = "127.0.0.1"
port = 3028
# Optional inference key — clients must send `Authorization: Bearer <api_key>`
# api_key = "keychain:any-converter:server:inference"

# Control which client headers are forwarded to upstream providers.
# mode = "allow" forwards all non-sensitive headers except the deny list (default).
# mode = "deny" only forwards headers matching the allow list.
# [server.pass_through_headers]
# mode = "allow"
# allow = ["x-custom-*"]
# deny  = ["x-internal-*"]

# ── Provider Definitions ─────────────────────────────────────────────
# Each provider is an upstream LLM endpoint with its own API key and format.

[[providers]]
name = "openai"
format = "openai_chat"
base_url = "https://api.openai.com"
api_key = "keychain:any-converter:provider:openai"

[[providers]]
name = "anthropic"
format = "claude"
base_url = "https://api.anthropic.com"
api_key = "keychain:any-converter:provider:anthropic"
# Model map supports wildcard patterns; longest match wins
# model_map = { "claude-opus-*" = "claude-opus-4-20250514", "claude-*" = "claude-sonnet-4-20250514" }

[[providers]]
name = "deepseek"
format = "openai_chat"
base_url = "https://api.deepseek.com"
api_key = "keychain:any-converter:provider:deepseek"

# Optional provider transport overrides for OpenAI-compatible providers
# whose paths or auth headers differ from the default format conventions.
# [providers.endpoints]
# path = "/v1/chat/completions"
# stream_path = "/v1/chat/completions"
#
# [providers.auth]
# scheme = "bearer"  # bearer, api_key_header, x_api_key, google_api_key, anthropic, none
# headers = { "x-custom-header" = "value" }

[[providers]]
name = "gemini"
format = "gemini"
base_url = "https://generativelanguage.googleapis.com"
api_key = "keychain:any-converter:provider:gemini"

# ── Model Routes (recommended) ──────────────────────────────────────
# Route requests to providers based on model name (glob patterns).
# First match wins. Supports failover via multiple providers.

[[model_routes]]
pattern = "claude-*"
provider = "anthropic"

[[model_routes]]
pattern = "gpt-*"
provider = "openai"

[[model_routes]]
pattern = "o1-*"
provider = "openai"

[[model_routes]]
pattern = "o3-*"
provider = "openai"

[[model_routes]]
pattern = "deepseek-*"
provider = "deepseek"

[[model_routes]]
pattern = "gemini-*"
provider = "gemini"

# Failover example: try openai first, then deepseek as backup
# [[model_routes]]
# pattern = "gpt-*"
# providers = ["openai", "deepseek"]
# strategy = "priority"
#
# Load-balance start provider while retaining failover order
# [[model_routes]]
# pattern = "gpt-*"
# providers = ["openai", "deepseek"]
# strategy = "round_robin"

# Wildcard fallback: any unmatched model goes to openai
[[model_routes]]
pattern = "*"
provider = "openai"
upstream_model = "gpt-4.1-mini"

# ── Logging ──────────────────────────────────────────────────────────

[logging]
level = "info"
dir = "./logs"          # Enables the SQLite log database at logs/any-converter.sqlite3
max_disk_mb = 500
# Days of request logs to keep in the database; 0 keeps everything.
retention_days = 30        # request metadata (request_logs)
body_retention_days = 7    # captured bodies + traces (request_bodies)
rollup_retention_days = 0  # hourly aggregates; 0 keeps them forever
# Also write one JSON line per request to usage.YYYY-MM-DD.jsonl.
# Off by default: the file is for tail/jq/backup, nothing reads it for queries.
# jsonl_mirror = true
# Log headers sent to upstream providers (sensitive values redacted).
# upstream_headers_log = true

# Optional full request/response audit logging.
# When enabled, each request's metadata and body are stored in
# logs/any-converter.sqlite3 (request_logs + request_bodies).
[logging.request_log]
enabled = true
max_capture_bytes = 1048576   # 1 MiB per captured body (three bodies + trace per row)
trace_enabled = true          # Extract message/tool summaries into request log records
trace_max_preview_bytes = 2048

[logging.console]
enabled = true
output = "stdout"
format = "pretty"

# [[logging.files]]
# name = "general"
# level = "info"
# format = "json"
# rotation = "daily"

# ── Subscription accounts (OAuth) ──────────────────────────────────────
#
# Sign in once with `any-converter accounts add gemini`, then point a
# provider at the stored account. An account signs requests with its own
# OAuth token (refreshed automatically, cross-process safe) and rides its
# vendor's wire instead of the plain API:
#
#   gemini  → Google Code Assist  POST {base}/v1internal:generateContent
#             body wrapped as {"model": ..., "request": <gemini body>}
#             base_url = "https://cloudcode-pa.googleapis.com"
#
# `wire` may be set explicitly (gemini_api | code_assist); it is otherwise
# derived from the account id's provider prefix.
#
# [[providers]]
# name = "gemini"
# format = "gemini"
# base_url = "https://cloudcode-pa.googleapis.com"
# api_key = ""                                  # unused: the account signs
# account = "gemini:you@example.com"
#
# Sign in with ChatGPT: OpenAI's own API, at /v1/responses. `accounts add
# chatgpt-api` ends by pasting the address the browser landed on (it carries
# the code and the client id OpenAI issued).
#
# [[providers]]
# name = "chatgpt-api"
# format = "openai_responses"
# base_url = "https://api.openai.com"
# api_key = ""
# account = "chatgpt-api:you@example.com"
